<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chat IA Gratuit</title>

<style>
body { font-family: Arial; background:#f5f5f5; display:flex; justify-content:center; }
#box { width:400px; background:white; margin-top:20px; padding:10px; border-radius:10px; }
#chat { height:400px; overflow:auto; padding:10px; }
.user { background:#DCF8C6; padding:8px; margin:5px; border-radius:10px; text-align:right; }
.bot { background:#eee; padding:8px; margin:5px; border-radius:10px; }
input { width:75%; padding:10px; }
button { padding:10px; }
</style>
</head>

<body>

<div id="box">
<h3>💬 Chat IA gratuit</h3>

<div id="chat"></div>

<input id="input" placeholder="Écris..." />
<button onclick="send()">➤</button>
</div>

<script>

async function send() {
  const input = document.getElementById("input");
  const message = input.value;
  if (!message) return;

  const chat = document.getElementById("chat");

  chat.innerHTML += `<div class='user'>${message}</div>`;
  input.value = "";

  const response = await fetch(
    "https://api-inference.huggingface.co/models/facebook/blenderbot-400M-distill",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        inputs: message
      })
    }
  );

  const data = await response.json();

  let reply = "Erreur IA";

  if (data && data.generated_text) {
    reply = data.generated_text;
  }

  chat.innerHTML += `<div class='bot'>${reply}</div>`;
  chat.scrollTop = chat.scrollHeight;
}

</script>

</body>
</html>
