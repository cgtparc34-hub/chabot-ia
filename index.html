<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Chat IA</title>
</head>

<body>

<h2>💬 Mon Chat IA</h2>

<div id="chat" style="height:400px;overflow:auto;border:1px solid #ccc;padding:10px;"></div>

<input id="input" placeholder="Écris..." style="width:70%;" />
<button onclick="send()">Envoyer</button>

<script>
async function send() {
  const input = document.getElementById("input");
  const message = input.value;

  if (!message) return;

  document.getElementById("chat").innerHTML += "<div><b>Toi:</b> " + message + "</div>";

  input.value = "";

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message })
  });

  const data = await res.json();

  document.getElementById("chat").innerHTML += "<div><b>IA:</b> " + data.reply + "</div>";
}
</script>

</body>
</html>
