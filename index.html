<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat IA</title>

<style>

body {
  margin: 0;
  background: #f5f5f5;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

#container {
  width: 420px;
  height: 650px;
  background: white;
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 5px 20px rgba(0,0,0,0.15);
  overflow: hidden;
}

#header {
  background: #111827;
  color: white;
  padding: 18px;
  font-size: 20px;
  font-weight: bold;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  background: #f9fafb;
}

.message {
  margin-bottom: 15px;
  max-width: 80%;
  padding: 12px 15px;
  border-radius: 15px;
  line-height: 1.4;
}

.user {
  background: #2563eb;
  color: white;
  margin-left: auto;
  border-bottom-right-radius: 5px;
}

.bot {
  background: #e5e7eb;
  color: #111827;
  margin-right: auto;
  border-bottom-left-radius: 5px;
}

#input-area {
  display: flex;
  border-top: 1px solid #ddd;
  padding: 10px;
  background: white;
}

#input {
  flex: 1;
  border: 1px solid #ccc;
  border-radius: 10px;
  padding: 12px;
  font-size: 15px;
  outline: none;
}

button {
  margin-left: 10px;
  border: none;
  background: #2563eb;
  color: white;
  padding: 12px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
}

button:hover {
  background: #1d4ed8;
}

</style>
</head>

<body>

<div id="container">

  <div id="header">
    💬 Assistant IA
  </div>

  <div id="chat"></div>

  <div id="input-area">
    <input
      id="input"
      type="text"
      placeholder="Écris ton message..."
    />
    <button onclick="sendMessage()">Envoyer</button>
  </div>

</div>

<script>

async function sendMessage() {

  const input = document.getElementById("input");
  const message = input.value.trim();

  if (!message) return;

  const chat = document.getElementById("chat");

  // message utilisateur
  chat.innerHTML += `
    <div class="message user">
      ${message}
    </div>
  `;

  input.value = "";

  // scroll
  chat.scrollTop = chat.scrollHeight;

  try {

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message
      })
    });

    const data = await response.json();

    // réponse IA
    chat.innerHTML += `
      <div class="message bot">
        ${data.reply}
      </div>
    `;

    chat.scrollTop = chat.scrollHeight;

  } catch (error) {

    chat.innerHTML += `
      <div class="message bot">
        Erreur de connexion.
      </div>
    `;
  }
}

// envoyer avec ENTER
document.getElementById("input")
  .addEventListener("keypress", function(e) {

    if (e.key === "Enter") {
      sendMessage();
    }

  });

</script>

</body>
</html>
