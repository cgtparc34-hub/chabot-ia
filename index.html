<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Assistant IA</title>

<style>

body{
  margin:0;
  background:#f3f4f6;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

#container{
  width:420px;
  height:700px;
  background:white;
  border-radius:20px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

#header{
  background:#111827;
  color:white;
  padding:20px;
  font-size:20px;
  font-weight:bold;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:15px;
  background:#f9fafb;
}

.message{
  max-width:80%;
  padding:12px 15px;
  margin-bottom:15px;
  border-radius:15px;
  line-height:1.5;
}

.user{
  background:#2563eb;
  color:white;
  margin-left:auto;
  border-bottom-right-radius:5px;
}

.bot{
  background:#e5e7eb;
  color:#111827;
  margin-right:auto;
  border-bottom-left-radius:5px;
}

#input-area{
  display:flex;
  padding:10px;
  border-top:1px solid #ddd;
  background:white;
}

#input{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:15px;
  outline:none;
}

button{
  margin-left:10px;
  border:none;
  background:#2563eb;
  color:white;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}

button:hover{
  background:#1d4ed8;
}

.typing{
  opacity:0.7;
  font-style:italic;
}

</style>

</head>

<body>

<div id="container">

  <div id="header">
    💬 Assistant IA
  </div>

  <div id="chat"></div>

  <div id="input-area">

    <input
      id="input"
      type="text"
      placeholder="Écris ton message..."
    />

    <button onclick="sendMessage()">
      Envoyer
    </button>

  </div>

</div>

<script>

async function sendMessage(){

  const input = document.getElementById("input");
  const message = input.value.trim();

  if(!message) return;

  const chat = document.getElementById("chat");

  // message utilisateur
  chat.innerHTML += `
    <div class="message user">
      ${message}
    </div>
  `;

  input.value="";

  // typing
  const typingId = "typing-" + Date.now();

  chat.innerHTML += `
    <div class="message bot typing" id="${typingId}">
      IA écrit...
    </div>
  `;

  chat.scrollTop = chat.scrollHeight;

  try{

    const response = await fetch("/api/chat",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        message
      })

    });

    const data = await response.json();

    document.getElementById(typingId).remove();

    chat.innerHTML += `
      <div class="message bot">
        ${data.reply}
      </div>
    `;

    chat.scrollTop = chat.scrollHeight;

  }

  catch(error){

    document.getElementById(typingId).remove();

    chat.innerHTML += `
      <div class="message bot">
        Erreur de connexion.
      </div>
    `;

  }

}

document
.getElementById("input")
.addEventListener("keypress",function(e){

  if(e.key==="Enter"){
    sendMessage();
  }

});

</script>

</body>
</html>
